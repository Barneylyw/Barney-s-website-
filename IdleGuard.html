<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link rel="stylesheet" type="text/css" href="main.css">
		<title>My Projects & Involvements</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
		<style>
			body {
				background: linear-gradient(135deg, #2196F3 0%, #00C853 100%);
				min-height: 100vh;
			}

			.navbar {
				background: linear-gradient(90deg, #2196F3 0%, #00C853 100%) !important;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.navbar-brand, .nav-link {
				color: white !important;
				font-weight: 500;
			}

			.nav-link:hover {
				color: #ffd700 !important;
				text-decoration: underline;
			}

			.navbar-toggler {
				border: 1px solid rgba(255, 255, 255, 0.5) !important;
				padding: 0.25rem 0.75rem;
			}

			.navbar-toggler-icon {
				background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='rgba(255, 255, 255, 0.8)' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e") !important;
			}

			.container {
				background: rgba(255, 255, 255, 0.95);
				border-radius: 15px;
				padding: 40px;
				margin-top: 30px;
				margin-bottom: 30px;
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
			}

			h1 {
				color: #333;
				font-weight: bold;
				margin-bottom: 20px;
			}

			h2 {
				color: #333;
				font-weight: bold;
				margin-top: 30px;
				margin-bottom: 20px;
				padding-bottom: 10px;
				border-bottom: 3px solid #2196F3;
			}

			.card {
				border: none;
				border-radius: 10px;
				box-shadow: 0 4px 15px rgba(33, 150, 243, 0.15);
				background: linear-gradient(135deg, #f5f7fa 0%, #e0f2f1 100%);
				margin-bottom: 20px;
			}

			.card:hover {
				box-shadow: 0 8px 25px rgba(33, 150, 243, 0.3);
				transform: translateY(-3px);
			}

			.card-body {
				padding: 25px;
			}

			.card-title {
				color: #333;
				font-weight: bold;
				font-size: 1.3rem;
				margin-bottom: 10px;
			}

			.card-text {
				color: #555;
				font-size: 1rem;
				line-height: 1.6;
			}

			a {
				text-decoration: none;
				color: inherit;
			}

			.section-wrapper {
				margin-bottom: 40px;
			}

			.skills-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
				gap: 15px;
				margin: 20px 0;
			}

			.skill-badge {
				background: linear-gradient(135deg, #2196F3 0%, #00C853 100%);
				color: white;
				padding: 12px 16px;
				border-radius: 8px;
				text-align: center;
				font-weight: 500;
				box-shadow: 0 4px 10px rgba(33, 150, 243, 0.2);
			}

			p {
				color: #555;
				line-height: 1.8;
			}

			.wip-banner {
				background: linear-gradient(90deg, #FFC107 0%, #FF9800 100%);
				color: #333;
				padding: 15px 20px;
				text-align: center;
				font-weight: 500;
				border-bottom: 2px solid #FF6F00;
				margin-bottom: 20px;
			}

			.status-badge {
				display: inline-block;
				padding: 6px 12px;
				border-radius: 20px;
				font-size: 0.85rem;
				font-weight: 600;
				margin-top: 10px;
				margin-right: 8px;
			}

			.status-inprogress {
				background-color: #FF9800;
				color: white;
			}

			.status-completed {
				background-color: #4CAF50;
				color: white;
			}

			.github-badge {
				display: inline-block;
				padding: 4px 10px;
				border-radius: 15px;
				font-size: 0.75rem;
				font-weight: 600;
				background-color: #333;
				color: white;
				margin-left: 8px;
			}

			.github-link {
				display: inline-block;
				margin-top: 10px;
				padding: 6px 12px;
				background-color: #333;
				color: white;
				border-radius: 6px;
				font-size: 0.9rem;
				text-decoration: none;
				font-weight: 500;
			}

			.github-link:hover {
				background-color: #555;
				text-decoration: none;
				color: white;
			}
		</style>
	</head>
	<body>

		<nav class="navbar navbar-expand-md navbar-light">
		  <div class="container-fluid">
		    <a class="navbar-brand" href="index.html">🚀 Home</a>
		    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
		      <span class="navbar-toggler-icon"></span>
		    </button>
		    <div class="collapse navbar-collapse" id="navbarNav">
		      <div class="navbar-nav">
		        <a class="nav-link" href="page1.html">Contact</a>
		      </div>
		    </div>
		  </div>
		</nav>

		<div class="container">
			Documentation for IdleGuard coming soon
		</div>

		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP28lgoAoJAH+22JNfQTH5IvA8qZZb" crossorigin="anonymous"></script>
	</body>
</html>
